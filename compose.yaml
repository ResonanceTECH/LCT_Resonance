services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsphack}
      POSTGRES_USER: ${POSTGRES_USER:-fspadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fspadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fsphack}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-fspadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fsphack}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

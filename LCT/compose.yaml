# ML matcher with a SQLite mini-db on the ml-data volume.
# Backend (separate compose in the parent repo) calls POST http://ml:8001/rank.
services:
  ml:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_PATH: /data/resonance.db
    volumes:
      - ml-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  ml-data:

# SPA + reverse proxy: UI and API share one origin, so no CORS is needed and the
# refresh cookie (path=/api/auth) works as first-party. Swagger: /api/docs.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # The MSW worker must not be cached, or mock changes never reach the browser.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
